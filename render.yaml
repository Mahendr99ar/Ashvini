services:
  - type: web
    name: ashvini-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install ".[model]"
    startCommand: uvicorn ashvini.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ASHVINI_DATABASE_URL
        sync: false
      - key: ASHVINI_DATA_SOURCE
        value: celestrak
      - key: ASHVINI_SPACEWEATHER_SOURCE
        value: noaa
      - key: ASHVINI_CORS_ORIGINS
        value: https://ashvini-iota.vercel.app,http://localhost:5173
      - key: ASHVINI_SECRET
        sync: false   # paste the same value as the GitHub secret, or API keys made with the admin tool will not match
      - key: ASHVINI_RISK_MODEL_PATH
        value: models/collision-risk.onnx   # served only while its model card says it beats the baseline
